<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes Eslatmalar Ilovasi</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      padding: 30px;
    }

    .app {
      width: 100%;
      max-width: 500px;
      background: #1e1e1e;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      outline: none;
      resize: none;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #00c853;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #00a844;
    }

    .notes {
      margin-top: 20px;
    }

    .note {
      background: #2c2c2c;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 12px;
      word-wrap: break-word;
    }

    .note p {
      margin: 0 0 10px 0;
      line-height: 1.4;
    }

    .delete-btn {
      background: #e53935;
      margin-top: 5px;
    }

    .delete-btn:hover {
      background: #c62828;
    }

    .empty {
      text-align: center;
      color: #aaa;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="app">
    <h1>📝 Eslatmalar</h1>

    <textarea id="noteInput" placeholder="Eslatma yozing..."></textarea>
    <button onclick="addNote()">Qo‘shish</button>

    <div id="notesList" class="notes"></div>
  </div>

  <script>
    const noteInput = document.getElementById("noteInput");
    const notesList = document.getElementById("notesList");

    let notes = JSON.parse(localStorage.getItem("notes")) || [];

    function saveNotes() {
      localStorage.setItem("notes", JSON.stringify(notes));
    }

    function showNotes() {
      notesList.innerHTML = "";

      if (notes.length === 0) {
        notesList.innerHTML = '<p class="empty">Hali eslatma yo‘q</p>';
        return;
      }

      notes.forEach(function(note, index) {
        const noteDiv = document.createElement("div");
        noteDiv.className = "note";

        noteDiv.innerHTML = `
          <p>${note}</p>
          <button class="delete-btn" onclick="deleteNote(${index})">O‘chirish</button>
        `;

        notesList.appendChild(noteDiv);
      });
    }

    function addNote() {
      const noteText = noteInput.value.trim();

      if (noteText === "") {
        alert("Avval eslatma yozing!");
        return;
      }

      notes.push(noteText);
      noteInput.value = "";

      saveNotes();
      showNotes();
    }

    function deleteNote(index) {
      notes.splice(index, 1);

      saveNotes();
      showNotes();
    }

    showNotes();
  </script>

</body>
</html>
